[project]
name = "crystalize"
version = "0.1.0"
description = "A FUSER MCP server"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
crystalize = "crystalize.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crystalize"]

[dependency-groups]
dev = ["pytest>=8.0"]
